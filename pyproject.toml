[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "sxm"
version = "0.3.3"
description = "For Personal Use Only"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "AngellusMortis", email = "cbailey@mort.is" },
  { name = "Michael Garcia", email = "thecrazygm@gmail.com" },
]
license = { text = "MIT license" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
keywords = ["sxm", "SiriusXM", "XM Radio"]
dependencies = [
  "aiohttp",
  "fake-useragent",
  "httpx",
  "make-it-sync",
  "pydantic",
  "python-dotenv",
  "tenacity",
  "typer==0.17.3",
  "ua-parser",
]

[tool.uv]
default-groups = []

[project.urls]
Homepage = "https://github.com/AngellusMortis/sxm-client"
Documentation = "https://sxm-client.readthedocs.io/en/latest/"

[project.scripts]
sxm = "sxm.__main__:start"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Enable pycodestyle (E), pyflakes (F), and flake8-bugbear (B)
select = ["E", "F", "B"]
# Ignore specific rules
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"




[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket"
filterwarnings = [
  "ignore:There is no current event loop:DeprecationWarning",
  "ignore:Failing to pass a value to the 'type_params' parameter:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-socket",
    "coverage",
    "bandit",
    "ruff",
    "ty",
]
doc = ["furo", "sphinx"]
test = [
    "pytest",
    "pytest-cov",
    "pytest-socket",
    "pytest-sugar",
    "pytest-clarity",
    "coverage",
]
